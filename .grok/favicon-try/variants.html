<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<style>
  body { background: #888; font-family: sans-serif; margin: 24px; }
  .row { display: flex; gap: 24px; align-items: flex-end; margin-bottom: 32px; }
  .cell { text-align: center; color: #fff; font-size: 11px; }
  .s16 { width: 16px; height: 16px; image-rendering: pixelated; }
  .s32 { width: 32px; height: 32px; }
  .s64 { width: 64px; height: 64px; }
  .s256 { width: 256px; height: 256px; }
</style>
</head>
<body>

<!-- Variant A: stroke S + triangle arrow, espresso tile -->
<svg id="a" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="256" height="256">
  <rect width="32" height="32" rx="6" fill="#1A1612"/>
  <path d="M9.2 22.2
           C9.2 26.6 22.6 27.2 22.8 22.4
           C22.9 18.8 9.6 18.4 9.6 13.2
           C9.6 8.4 21.4 7.6 23 12.2"
        fill="none" stroke="#B08A62" stroke-width="5.6" stroke-linecap="butt" stroke-linejoin="round"/>
  <polygon points="20.4,6.2 27.4,8.6 22.2,13.6" fill="#B08A62"/>
</svg>

<!-- Variant B: slightly thinner, more open counters, notch suggested -->

           C10 26.2 21.8 26.6 22.2 21.6

           C10.8 8.8 21.2 8.2 22.6 12.4"
        fill="none" stroke="#B08A62" stroke-width="5.2" stroke-linecap="butt" stroke-linejoin="round"/>
  <path d="M20.8 6.0 L27.6 9.2 L21.6 13.8 Z" fill="#B08A62"/>
  <!-- small SE chevron cut suggestion: a espresso triangle biting the lower-right -->
  <path d="M23.6 19.2 L28.2 22.4 L23.2 24.6 Z" fill="#1A1612"/>
</svg>

<!-- Variant D: geometric wayfinding S — two thick arcs + arrow, very simple -->
<svg id="d" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="256" height="256">
  <rect width="32" height="32" rx="6" fill="#1A1612"/>

  <path d="M9 19.2 C9 24.8 23 25.2 23.5 19.6" fill="none" stroke="#B08A62" stroke-width="6" stroke-linecap="butt"/>

  <polygon points="21,5.8 28.4,9.2 21.6,14" fill="#B08A62"/>

<svg id="e" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="256" height="256">

           C22.9 18.8 9.6 18.4 9.6 13.2

<!-- Variant G: closest to the photo — heavy S, NE arrow, diagonal cut -->
<svg id="g" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="256" height="256">
  <rect width="64" height="64" rx="12" fill="#1A1612"/>
  <g transform="translate(32 34) scale(1.05)">

<div class="row" id="big">
</div>
<div class="row" id="med"></div>
<div class="row" id="sml"></div>
<script>
const ids = ['a','b','c','d','e','f','g'];
function cloneRow(sizeClass, target) {
  ids.forEach(id => {
    const cell = document.createElement('div');
    cell.className = 'cell';
    const s = document.getElementById(id).cloneNode(true);
    s.removeAttribute('id');
    s.setAttribute('class', sizeClass);
    s.setAttribute('width', '');
    s.setAttribute('height', '');
    cell.appendChild(s);
    const cap = document.createElement('div');
    cap.textContent = id.toUpperCase() + ' ' + sizeClass;
    cell.appendChild(cap);
    document.getElementById(target).appendChild(cell);
  });
}
cloneRow('s256','big');
cloneRow('s64','med');
cloneRow('s16','sml');
</script>
</body>
</html>
